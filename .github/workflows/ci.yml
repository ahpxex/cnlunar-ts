name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'cnlunar-bun/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'cnlunar-bun/**'

defaults:
  run:
    working-directory: cnlunar-bun

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          cd ..
          pip install -e .

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Check package
        run: npm pack --dry-run
